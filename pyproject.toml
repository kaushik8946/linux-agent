[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai",
  "python-dotenv",
  "rich",
  "pydantic"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
linux-agent = "cli.app:main"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["agent*", "cli*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
extend-exclude = ["docs"]
