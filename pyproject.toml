[project]
name = "linux-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "openai",
  "python-dotenv",
  "rich",
  "pydantic"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
linux-agent = "cli.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
